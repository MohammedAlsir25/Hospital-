name: Al Jawarih ERP - Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    name: "CI Build, Lint & API Test Suite"
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v3

    - name: 2. Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: 3. Install NPM Dependencies
      run: npm ci

    - name: 4. Execute Structural Code Linter Verification
      run: npm run lint

    - name: 5. Execute Production Build & Packaging Compilation
      run: npm run build

  continuous-delivery:
    name: "CD Base Image Containerization"
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Checkout Source Code
      uses: actions/checkout@v3

    - name: 2. Set up Docker Buildx Builder
      uses: docker/setup-buildx-action@v2

    - name: 3. Authenticate to Private Registry Container Storage (GHCR)
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 4. Build and Push Production Docker Container Image File
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/erp-backend:latest
          ghcr.io/${{ github.repository }}/erp-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
